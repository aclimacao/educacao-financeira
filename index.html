return `<svg class="av" viewBox="0 0 100 112" width="${w}" height="${w*1.12}"><g fill="${k}">${h[0]}</g><path d="M4 112C6 88 24 80 50 80S94 88 96 112Z" fill="${SH[i]}"/><rect x="42" y="64" width="16" height="22" rx="6" fill="${sk}"/><rect x="42" y="74" width="16" height="8" fill="#000" fill-opacity=".14"/>${fit}<circle cx="24" cy="56" r="5" fill="${sk}"/><circle cx="76" cy="56" r="5" fill="${sk}"/><path d="M24 48C24 24 76 24 76 48C76 70 64 82 50 82C36 82 24 70 24 48Z" fill="${sk}"/><path d="M76 48C76 70 64 82 50 82C60 76 70 62 70 46Z" fill="#000" fill-opacity=".06"/>${c.bd?`<path d="M25 55C25 80 38 90 50 90C62 90 75 80 75 55C71 67 65 71 58 70Q50 66 42 70C35 71 29 67 25 55Z" fill="${k}"/>`:''}<circle cx="35" cy="64" r="5" fill="#f43f5e" fill-opacity=".16"/><circle cx="65" cy="64" r="5" fill="#f43f5e" fill-opacity=".16"/><path d="M26 44C34 36 66 36 74 44C66 40 34 40 26 44Z" fill="#000" fill-opacity=".1"/><path d="M42 69.5Q50 77.5 58 69.5Q50 72.5 42 69.5Z" fill="#fff" stroke="#9f2d3a" stroke-width="1.6" stroke-linejoin="round"/><path d="M49 55q-2.5 7-1 9q2 1.5 4.5 0" ${ln}/>${eyes}<path d="M32 45q6-3.5 13-1.5M55 43.5q7-2 13 1.5" stroke="${k}" stroke-width="${i>3?2.9:2.3}" stroke-linecap="round" fill="none"/>${ag}<path d="${h[1]}" fill="${k}"/>${gl}</svg>`}
const go=s=>{S.scr=s;draw()},set=(k,v)=>{S.ch[k]=v;draw()};
function start(){S.name=S.name.trim()||'Alex';go('play')}
const pay=x=>{const s=S.st;for(const k of['cash','res','inv']){const t=Math.min(s[k],x);s[k]-=t;x-=t}s.debt+=x;return x};
function sim(){const s=S.st;let sp=Object.values(s.e).reduce((a,b)=>a+b,0)*12;
s.debt*=1.15;let p=s.debt*.25;s.debt-=p;sp+=p;s.mort*=1.1;p=s.mort*.11;s.mort-=p;sp+=p; // juros simplificados
const n=s.sal*12-sp;if(n>0){s.res+=n*(s.sv||0);s.inv+=n*(s.si||0);s.cash+=n*(1-(s.sv||0)-(s.si||0))}else s.cash+=n;if(s.cash<0){s.debt-=s.cash;s.cash=0}
s.cash*=.96;s.inv*=1.08;s.res*=1.06;s.house*=1.04} // inflação, rendimentos e valorização
function pick(k){navigator.vibrate&&navigator.vibrate(20);const D=DEC[S.i],o=D.o[k],s=S.st,a={...s},nt=[o.r],last=S.i==5,f=AG[S.i];
Object.entries(o.d||{}).forEach(([x,v])=>s[x]+=v);if(o.m)Object.assign(s.e,o.m);s.sv=o.sv||0;s.si=o.si||0;if(o.pr){if(Math.random()<o.pr[0]){s.sal+=o.pr[1];s.prom=(s.prom||0)+o.pr[1];nt.push('Uma promoção apareceu no trabalho!')}else nt.push('A promoção ainda não veio.')}
if(o.rv){s.res+=s.cash*o.rv;s.cash*=1-o.rv}if(o.iv){s.inv+=s.cash*o.iv;s.cash*=1-o.iv}
const loan=x=>{const g=pay(x);if(g>0)nt.push('Você não tinha o suficiente e completou com um empréstimo de '+R(g)+', que cobra juros altos.')};
if(o.b)loan(o.b);if(o.set){const v=o.set(s);s.sal=v;if(o.x)nt.push(o.x(v))}if(o.job)s.job=o.job;
S.log.push([f,o.n]);if(!last)for(let j=0;j<AG[S.i+1]-f;j++)sim();
if(o.bl)loan(o.bl);s.free=cl(s.free);s.qol=cl(s.qol);if(!last){S.i++;HK[S.i]&&HK[S.i](s)}
const dl=(l,d,inv,u='')=>Math.abs(d)<1?'':`<div class="dr"><span>${l}</span><b class="${(d>0)!=!inv?'neg':'pos'}">${d>0?'+':'−'}${u?Math.abs(d)+' '+u:R(Math.abs(d))}</b></div>`;
const rows=dl('Dinheiro',s.cash-a.cash)+dl('Reserva',s.res-a.res)+dl('Investimentos',s.inv-a.inv)+dl('Imóvel',s.house-a.house)+dl('Dívidas',s.debt+s.mort-a.debt-a.mort,1)+dl('Salário',s.sal-a.sal)+dl('Tempo livre',s.free-a.free,0,'pts')+dl('Qualidade de vida',s.qol-a.qol,0,'pts');
S.nx={f,t:AG[S.i],nt,rows,tip:D.tip,last};go('skip')}
const V={
intro:()=>`<div class="card hero" style="text-align:center;margin:auto 0;padding:28px 18px"><div style="font-size:56px">💸</div><h1>Simulador de Vida Financeira</h1><p>Dos 16 aos 60 anos, só 6 decisões. Não existe resposta certa: cada escolha tem vantagens, custos e consequências futuras.</p></div><button class="btn g" onclick="go('cust')">Começar</button>`,
cust:()=>`<div class="card" style="justify-items:center;text-align:center"><h2>Crie seu personagem</h2>${av(0,150)}<input id="nm" value="${esc(S.name)}" placeholder="Seu nome" maxlength="14" oninput="S.name=this.value"></div>
<div class="card"><b>Cabelo</b><div class="grid4">${HR.map((_,k)=>`<button class="pk ${S.ch.h==k?'on':''}" onclick="set('h',${k})">${av(0,58,{...S.ch,h:k})}${HN[k]}</button>`).join('')}</div>
<b>Cor do cabelo</b><div class="row">${HC.map((c,k)=>`<button class="sw ${S.ch.hc==k?'on':''}" style="background:${c}" aria-label="Cor ${k+1}" onclick="set('hc',${k})"></button>`).join('')}</div>
<b>Cor da pele</b><div class="row">${SK.map((c,k)=>`<button class="sw ${S.ch.sk==k?'on':''}" style="background:${c}" aria-label="${SN[k]}" onclick="set('sk',${k})"></button>`).join('')}</div>
<b>Óculos</b><div class="grid3">${['Sem','Redondo','Quadrado'].map((t,k)=>`<button class="pk ${S.ch.g==k?'on':''}" onclick="set('g',${k})">${t}</button>`).join('')}</div>
<b>Barba</b><div class="grid"><button class="pk ${S.ch.bd?'':'on'}" onclick="set('bd',0)">Sem barba</button><button class="pk ${S.ch.bd?'on':''}" onclick="set('bd',1)">Com barba</button></div></div>
<button class="btn g" onclick="start()">Iniciar vida financeira</button>`,
play:()=>{const s=S.st,D=DEC[S.i],tot=s.cash+s.res+s.inv+s.house-s.debt-s.mort,dv=s.debt+s.mort,st=(l,v,c='')=>`<div class="st"><small>${l}</small><b class="${c}" data-v="${v}">${R(v)}</b></div>`,br=(l,v)=>`<div><small>${l} ${v}%</small><div class="bar"><i style="width:${v}%"></i></div></div>`;
return `<div class="stp">${AG.map((a,k)=>`<i class="${k<S.i?'d':k==S.i?'n':''}"></i>`).join('')}</div>
<div class="row" style="justify-content:flex-start;align-items:center;flex-wrap:nowrap">${av(S.i,64)}<div style="flex:1"><b>${esc(S.name)}</b><br><small style="color:var(--m)">${s.job}</small></div><span class="chip">${AG[S.i]} anos</span></div>
<div class="grid"><div class="st big"><small>Patrimônio líquido</small><b data-v="${tot}">${R(tot)}</b></div>${st('Salário',s.sal,'pos')}${st('Dinheiro',s.cash)}${st('Reserva',s.res,'pos')}${st('Investimentos',s.inv,'pos')}${st('Dívidas',dv,dv?'neg':'')}${st('Imóvel',s.house)}</div>
<div class="card">${br('⏰ Tempo livre',s.free)}${br('😊 Qualidade de vida',s.qol)}</div>
<div class="card hero"><h2>${D.t}</h2><p>${D.s}</p></div>${D.o.map((o,k)=>`<button class="opt" onclick="pick(${k})"><span class="lt">${'ABCD'[k]}</span><span><b>${o.n}</b><br><small>${o.c}</small></span></button>`).join('')}`},
skip:()=>{const n=S.nx;return `<div class="card hero" style="text-align:center"><small>${n.last?'Resultado da decisão':'Avançando no tempo'}</small><div id="tk" style="font-size:64px;font-weight:900">${n.f}</div><small>anos</small></div>
<div id="rs" class="${n.f<n.t?'h':''}" style="display:grid;gap:12px"><div class="card"><b>O que aconteceu</b>${n.nt.map(t=>`<p>${t}</p>`).join('')}</div>${n.rows?`<div class="card"><b>O que mudou${n.f<n.t?' em '+(n.t-n.f)+' anos':''}</b>${n.rows}</div>`:''}<div class="card tip"><p><b>💡 Você sabia?</b> ${n.tip}</p></div><button class="btn" onclick="go('${n.last?'end':'play'}')">${n.last?'Ver meu raio-X':'Continuar'}</button></div>`},
end:()=>{const s=S.st,tot=s.cash+s.res+s.inv+s.house-s.debt-s.mort,pm=(s.debt*.25+s.mort*.11)/12,E={mor:'🏠 Moradia',ali:'🍔 Alimentação',tra:'🚗 Transporte',laz:'🎮 Lazer',con:'💡 Contas',out:'📦 Outros'},rw=Object.entries(E).map(([k,l])=>[l,s.e[k]]);if(pm>0)rw.push(['💳 Parcelas de dívidas',pm]);
S.tot=tot;const it=(l,v,c='')=>`<div class="dr"><span>${l}</span><b class="${c}">${v}</b></div>`;
return `<div class="card hero" style="grid-template-columns:auto 1fr;align-items:center">${av(5,90)}<div><small>Aos 60 anos</small><h2>${esc(S.name)}</h2><p>${s.job}</p></div></div>
<div class="card"><h3>Raio-X financeiro</h3>${it('💰 Patrimônio total',R(tot),tot<0?'neg':'pos')}${it('📈 Investimentos',R(s.inv))}${it('🏠 Patrimônio imobiliário',R(s.house))}${it('💳 Dívidas',R(s.debt+s.mort),s.debt+s.mort?'neg':'')}${it('💵 Renda mensal',R(s.sal+s.inv*.004))}${it('🛟 Reserva',R(s.res))}${it('💵 Dinheiro disponível',R(s.cash))}${it('⏰ Tempo livre',s.free+'%')}${it('😊 Qualidade de vida',s.qol+'%')}</div>
<div class="card"><h3>Média de gastos mensais: ${R(rw.reduce((a,r)=>a+r[1],0))}</h3>${rw.map(r=>it(r[0],R(r[1]))).join('')}</div>
<div class="card"><h3>Sua linha do tempo</h3>${S.log.map((l,i)=>`<div class="dr"><b>${l[0]}</b><span style="text-align:right">${l[1]}</span></div>${i<5?'<div style="text-align:center;color:var(--m)">↓</div>':''}`).join('')}</div>
<div class="card hero" style="text-align:center"><p><b>Estas foram as consequências das escolhas que você fez ao longo da sua vida.</b></p></div>
<div class="card"><h3>Mural de trajetórias</h3><p><small>Cada trajetória é única: veja quem tem mais patrimônio, tempo livre ou qualidade de vida.</small></p><button id="sv" class="btn g" onclick="save()">Salvar minha trajetória</button><div id="mu"></div></div>
<button class="btn" onclick="init();draw()">Jogar novamente</button>`}};
function draw(){clearInterval(TI);const m=$('#m');m.style.animation='none';m.offsetHeight;m.style.animation='';m.innerHTML=V[S.scr]();scrollTo(0,0);
if(S.scr=='skip'&&S.nx.f<S.nx.t){let a=S.nx.f;TI=setInterval(()=>{const e=$('#tk');if(!e)return clearInterval(TI);e.textContent=++a;if(a>=S.nx.t){clearInterval(TI);$('#rs').classList.remove('h')}},300)}
cu();if(S.scr=='end')mural()}
function cu(){document.querySelectorAll('[data-v]').forEach(e=>{const k=e.parentNode.firstChild.textContent,v=+e.dataset.v,f=PV[k]??v,t=performance.now();PV[k]=v;(function u(n){if(!e.isConnected)return;const p=Math.min(1,(n-t)/700);e.textContent=R(f+(v-f)*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(u)})(t)})}
// ===== MURAL / RANKING =====
let MT='p';
async function rows(){try{if(API){const r=await fetch(API);return await r.json()}}catch(e){return[]}return JSON.parse(localStorage.getItem('mural')||'[]')}
async function mural(t){MT=t||MT;const L=(await rows()).sort((a,b)=>b[MT]-a[MT]).slice(0,10),tb=[['p','💰 Patrimônio'],['f','⏰ Tempo livre'],['q','😊 Qualidade']];
$('#mu').innerHTML=`<div class="grid3" style="margin:10px 0">${tb.map(([k,l])=>`<button class="pk ${k==MT?'on':''}" onclick="mural('${k}')">${l}</button>`).join('')}</div>`+(L.length?L.map((r,i)=>`<div class="dr"><span>${i+1}. ${esc(r.n)}</span><b>${MT=='p'?R(r.p):r[MT]+'%'}</b></div>`).join(''):'<p>Ainda não há trajetórias salvas.</p>')}
async function save(){const b=$('#sv');b.disabled=true;const r={n:S.name,p:Math.round(S.tot),f:S.st.free,q:S.st.qol};
if(API)await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(r)}).catch(()=>0);else{const L=JSON.parse(localStorage.getItem('mural')||'[]');L.push(r);localStorage.setItem('mural',JSON.stringify(L))}
b.textContent='✔ Trajetória salva';setTimeout(mural,API?1500:0)}
init();draw();
</script></body></html>
